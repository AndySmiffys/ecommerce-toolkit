# Learn more about configuring your app at https://shopify.dev/docs/apps/tools/cli/configuration

client_id = "c8717906a421013fbf5c47e976637862"
application_url = "https://example.com"
embedded = true
name = "eCommerce Toolkit"

[access_scopes]
scopes = "read_shipping,read_customers,read_discounts,write_discounts,read_products,write_products,read_files,write_files,read_online_store_pages,write_app_proxy"

[auth]
redirect_urls = [ "https://example.com/api/auth" ]

[webhooks]
# Keep in step with ApiVersion in app/shopify.server.ts (the installed @shopify/shopify-api supports up to July 2026).
api_version = "2026-07"

  [[webhooks.subscriptions]]
  uri = "/webhooks/app/uninstalled"
  topics = [ "app/uninstalled" ]

  [[webhooks.subscriptions]]
  uri = "/webhooks/app/scopes_update"
  topics = [ "app/scopes_update" ]

  [[webhooks.subscriptions]]
  uri = "/webhooks/discounts/changed"
  topics = [ "discounts/update", "discounts/delete", "discounts/redeemcode_added", "discounts/redeemcode_removed" ]

  [[webhooks.subscriptions]]
  uri = "/webhooks/collections/update"
  topics = [ "collections/update" ]

  [[webhooks.subscriptions]]
  uri = "/webhooks/products/update"
  topics = [ "products/update" ]

[build]
include_config_on_deploy = true
automatically_update_urls_on_dev = true

[app_proxy]
url = "/promotion-storefront"
prefix = "apps"
subpath = "promotion-engine"
